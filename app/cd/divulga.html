<!-- AGENDA CHEIA (bump, R$ 67, nivel `divulga`). Escada de 09/11/2026: clientes e agenda
     juntos, lendo os trattamenti do Controle do Studio (lucrostudioit_v1, so leitura).
     Clientes: ficha com WhatsApp e anotacoes, historico de trattamenti (data, servico,
     valor), quanto gastou, quantas vezes veio, ranking e sumidas com a mensagem pronta.
     Agenda: marcar, remarcar e desmarcar, visao do dia e da semana, lembrete da vespera

<script>/* rede de seguranca da ativacao: decide "legado" ou "pendente" ANTES de a pagina gravar o tema,
   mesmo que o ativacao.js nao carregue (sem isto, a primeira abertura com rede ruim virava legado) */
try{var K='lucrostudioit_ativacao';if(!localStorage.getItem(K)){var u=0;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('lucrostudioit_')===0){u=1;break}}localStorage.setItem(K,JSON.stringify(u?{estado:'legado',desde:Date.now()}:{estado:'pendente'}))}}catch(e){}</script>

<style>

header .loja{font-size:12px;opacity:.85;font-weight:400}
main{padding:14px;max-width:560px;margin:0 auto}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--rose);border-radius:12px;padding:12px}

button{font-family:inherit;border:0;cursor:pointer;border-radius:12px;font-size:16px}
.btn{background:var(--vinho);color:#fff;width:100%;padding:15px;font-weight:700;margin-top:8px}

input,select{width:100%;padding:13px;border:1.5px solid #8f8496;border-radius:12px;

input:focus,select:focus{outline:none;border-color:var(--vinho)}
label{font-size:13px;color:var(--cinza);font-weight:600;display:block;margin-top:12px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linha);

/* O fundo do modal segue a AREA VISIVEL (visualViewport), nao a tela inteira: top e height vem do
   script "MODAL ACIMA DO TECLADO". Bug real, 19/10/2026: o teclado do celular cobre o fundo da tela
   sem encolher a pagina; a busca do "Registrar venda" filtrava a lista, o modal (preso no fundo)

.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;
  max-height:88%;overflow-y:auto;padding:18px 16px 24px}
/* teclado aberto: o modal ocupa a area visivel inteira, entao o campo fica parado no topo
   enquanto a lista encolhe embaixo dele */
.modal-fundo.teclado .modal{height:100%;max-height:none;border-radius:0}
.modal h3{font-size:17px;margin-bottom:4px}

/* ===== O NUMERO QUE IMPORTA E GRANDE (21/09/2026) =====
   Regra do dono: "as clientes tem MUITA dificuldade com app, tem que ser facil e
   visualmente simples". Antes, "ainda falta" era mais uma linha do mesmo tamanho
   entre outras duas, e o resultado do que ela digitava vinha como frase corrida.

<script>
/* ===== O DIA E O DO CELULAR DELA (16/10/2026) =====
   Antes era new Date().toISOString(), que da o dia em Londres (UTC). No horario de
   Brasilia, das 21h a meia-noite a venda nascia com a data de AMANHA, sumia da tela
   Oggi e, no ultimo dia do mes, caia no mes seguinte. Agora e o dia do fuso do
   aparelho, que no Brasil e o da cidade dela (Brasilia, Manaus, Acre, Noronha). */
function hoje(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function agora(){ return new Date().toISOString(); }
function dataBR(iso){ return String(iso).split('-').reverse().join('/'); }
/* n dias antes de um dia ISO, sem o fuso mexer no resultado */
function diaAntes(iso, n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
/* o espaco aqui e NAO-SEPARAVEL (\u00a0): sem ele "4x de R$ 35,00" quebrava entre
   o "R$" e o numero no fim da linha, e a lojista tinha que remontar o valor */
function rs(n){ return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(Math.round(n*100)/100)); }
function num(v){ const s=String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; }
function fmtMoeda(n){ return (n||n===0) ? rs(n) : ''; }
const PGTO_LABEL={contanti:'Contanti',carta:'Carta',bonifico:'Bonifico',satispay:'Satispay',da_incassare:'Da incassare',pix:'Contanti',Contanti:'Contanti','Carta':'Carta',cartao:'Carta','Da incassare':'Da incassare'};
function rotuloPgto(f){ return PGTO_LABEL[f]||f; }
function ehIncasso(x){ const k=(x&&typeof x==='object')?x.pgto:x; return k==='da_incassare'||k==='Da incassare'; }
const TEMAS={
  vinho:   {a:'#8e2757',b:'#6d1d43',c:'#f6e7ee',d:'#fdf4f8',nome:'Bordeaux'},
  violeta: {a:'#6b3fa0',b:'#532e80',c:'#efe8f7',d:'#f9f5fd',nome:'Viola'},
  esmeralda:{a:'#176b50',b:'#145c45',c:'#e4f2ec',d:'#f3faf7',nome:'Smeraldo'},
  petroleo:{a:'#22677a',b:'#194f5e',c:'#e3eff3',d:'#f2f8fa',nome:'Petrolio'},
  grafite: {a:'#3f3a45',b:'#2b2730',c:'#ece9ef',d:'#f7f5f9',nome:'Grafite'}
};
function aplicarTema(n){ const t=TEMAS[n]||TEMAS.vinho; const r=document.documentElement.style;
  r.setProperty('--vinho',t.a); r.setProperty('--vinho-escuro',t.b);
  r.setProperty('--rose',t.c); r.setProperty('--rose-2',t.d);
  const m=document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content',t.a); }
aplicarTema((function(){ try{ return localStorage.getItem('lucrostudioit_tema'); }catch(e){ return null; } })()||'grafite');

/* ===== A AGENDA CHEIA CONFERE O DIREITO AO ABRIR (mesma regra do menu, liberado.js) =====
   Sem direito aparece a vitrine do card travado. Se o liberado.js nao carregou,
   recarrega UMA vez e, se ainda faltar, abre: quem pagou nunca fica trancado por
   falha de rede. */
const TRAVADA=(function(){
  if(window.Liberado) return Liberado.travar('divulga');
  try{ if(!sessionStorage.getItem('lucrostudioit_recarregou')){ sessionStorage.setItem('lucrostudioit_recarregou','1'); location.reload(); } }catch(e){}
  return false;
})();

/* ============ DEFESA 1: armazenamento persistente ============ */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

/* ===== TEXTO DA USUARIA NO HTML: UMA FUNCAO SO (igual ao Controle) =====
   Nome de cliente, servico, anotacao e WhatsApp vao pra HTML e pra value="...": escapa
   as 5 (& < > " '). id que vai pra dentro de onclick="...(id)": so numero inteiro.
   Nome de cliente NUNCA vai dentro de onclick: vai um numero (Ref). */
const escA = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const esc = escA;
const idn = x => { const n=Number(x); return Number.isInteger(n) ? n : -1; };

/* ============ TOAST ============ */
let toastTimer=null;
function toast(msg, guadagno){ const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast mostra'+(guadagno?' guadagno':'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',4500); }

/* ============ MODAL ============ */
const Modal = {
  /* ===== O MODAL E UM DIALOGO (acessibilidade, 26/10/2026) =====
     O leitor de tela nao sabia que o modal tinha aberto e seguia lendo a tela de
     tras. Agora: o titulo da nome ao dialogo, o resto da pagina fica inerte, o
     foco entra no modal (se nenhum campo dele ja pegou), Esc fecha, e ao fechar o
     foco volta pra onde estava. O toast e a tela de ativacao nunca ficam inertes. */
  _volta:null,
  abrir(html){ const c=document.getElementById('modalCorpo'), f=document.getElementById('modalFundo');
    if(!f.classList.contains('aberto')) this._volta=document.activeElement;
    c.innerHTML=html; f.classList.add('aberto'); this.ajustarArea();
    const tit=c.querySelector('h3, .passo, .wizard-logo .m1');
    if(tit){ tit.id='modalTit'; c.setAttribute('aria-labelledby','modalTit'); } else c.removeAttribute('aria-labelledby');
    Array.prototype.forEach.call(document.body.children, el=>{
      if(el===f || el.id==='toast' || el.id==='ativ' || el.hasAttribute('inert')) return;
      el.setAttribute('inert',''); el.setAttribute('data-modal-inert',''); });
    setTimeout(()=>{ if(f.classList.contains('aberto') && !c.contains(document.activeElement)) c.focus({preventScroll:true}); },60); },
  fechar(){ document.getElementById('modalFundo').classList.remove('aberto');
    document.querySelectorAll('[data-modal-inert]').forEach(el=>{ el.removeAttribute('inert'); el.removeAttribute('data-modal-inert'); });
    const v=this._volta; this._volta=null;
    if(v && document.body.contains(v) && v.focus) v.focus({preventScroll:true}); },
  /* ===== MODAL ACIMA DO TECLADO (19/10/2026) =====
     O teclado do celular (iPhone e Chrome do Android) encolhe so a area VISIVEL, nao a pagina,
     entao um position:fixed preso no fundo fica atras dele. Aqui o fundo do modal copia o
     tamanho e a posicao da area visivel a cada mudanca. */
  ajustarArea(){ const vv=window.visualViewport, f=document.getElementById('modalFundo'); if(!vv||!f) return;
    f.style.top=vv.offsetTop+'px'; f.style.height=vv.height+'px';
    f.classList.toggle('teclado', document.documentElement.clientHeight - vv.height > 120 && vv.scale < 1.05); }
};
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && document.getElementById('modalFundo').classList.contains('aberto')) Modal.fechar(); });
if(window.visualViewport){
  visualViewport.addEventListener('resize', ()=>Modal.ajustarArea());
  visualViewport.addEventListener('scroll', ()=>Modal.ajustarArea());
}


/* ============ AGENDA CHEIA: DADOS ============
   Tres chaves, como o Clientes na Mao da lojinha:
     lucrostudioit_v1       = o Controle (trattamenti e servicos). Aqui so LE, NUNCA grava.
     lucrostudioit_clientes = {v, seq, lista:[{id, nome, whats, obs, criadoEm, nomesAntigos}]}
     lucrostudioit_agenda   = {v, seq, horarios:[{id, data, hora, clienteId, nome, servicoId,
                             servico, obs, lembradoEm}], ciclos:{servicoId: dias},
                             avisos:{chaveDaCliente: dia em que ela foi chamada}}
   O backup do Controle leva as duas chaves novas (#CLIENTES, #AGENDA, #CICLOS, #AVISOS).
   A cliente de um trattamento: pelo clienteId quando ele existe; senao pelo NOME
   normalizado (sem acento, minusculo, espacos colapsados). Quem so tem o nome nos
   trattamenti aparece aqui do mesmo jeito, sem cadastrar de novo. */
const K_V1='lucrostudioit_v1', K_CLI='lucrostudioit_clientes', K_AG='lucrostudioit_agenda', K_ATENDER='lucrostudioit_atender';

/* ---------- regras (mudar aqui) ---------- */
const REGRAS = {
  CICLO_PADRAO: 21,   /* dias ate a manutencao, quando o servico nao tem ciclo proprio */
  ANTES: 2,           /* o aviso da manutencao aparece 2 dias antes do dia */
  JANELA: 8,          /* e fica ate 8 dias depois; passou disso, a cliente vira "sumida" */
  SUMIU_DIAS: 30      /* sumida: 30 dias ou mais sem trattamento (e fora da janela da manutencao) */
};

function ler(k){ try{ return JSON.parse(localStorage.getItem(k)||'null'); }catch(e){ return null; } }
function gravarK(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){ toast('Non riesco a salvare: il telefono non ha più spazio. Fai il backup in Guadagno in Mano e libera spazio sul telefono.'); return false; } }
function norm(t){ return String(t==null?'':t).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\s+/g,' ').trim(); }
function r2(n){ return Math.round(n*100)/100; }
function dias(a,b){ const x=Date.parse(String(a).slice(0,10)+'T12:00:00Z'), y=Date.parse(String(b||hoje()).slice(0,10)+'T12:00:00Z');
  return (isNaN(x)||isNaN(y)) ? 0 : Math.round((y-x)/864e5); }
function somaDias(iso,n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function diaSem(iso){
  const s=new Intl.DateTimeFormat('it-IT',{weekday:'short'}).format(new Date(iso+'T12:00:00'));
  return s.replace(/\.$/,'').toLowerCase();
}
function dataCurta(iso){ return diaSem(iso)+', '+String(iso).slice(8,10)+'/'+String(iso).slice(5,7); }
function primeiroNome(n){ return String(n||'').trim().split(/\s+/)[0]||''; }
/* numero brasileiro: so digitos; com DDD (10 ou 11) ganha o 55 na frente */
function foneWa(s){ const d=String(s||'').replace(/\D/g,'');
  if(d.length===10||d.length===11) return '55'+d;
  if((d.length===12||d.length===13) && d.indexOf('55')===0) return d;
  return ''; }
function linkWhats(fone, texto){ return 'https://wa.me/'+foneWa(fone)+'?text='+encodeURIComponent(texto||''); }
function abrirWhats(fone, texto){ window.open(linkWhats(fone, texto), '_blank', 'noopener,noreferrer'); }

/* espelho do Venda.jaPago / Venda.saldo do Controle (index.html): mudou la, mude aqui */
function jaPago(v){ if(Array.isArray(v.pagamentos)) return v.pagamentos.reduce((s,x)=>s+(Number(x.valor)||0),0); return v.pago ? v.total : 0; }
function saldo(v){ return Math.max(0, r2((Number(v.total)||0) - jaPago(v))); }

const Dados = {
  v1:null, cli:null, ag:null,
  carregar(){
    const v=ler(K_V1);
    this.v1=(v&&typeof v==='object')?v:{};
    if(!Array.isArray(this.v1.vendas)) this.v1.vendas=[];
    if(!Array.isArray(this.v1.produtos)) this.v1.produtos=[];
    if(!this.v1.config||typeof this.v1.config!=='object') this.v1.config={};
    let c=ler(K_CLI);
    if(!c || typeof c!=='object' || !Array.isArray(c.lista)){
      c={v:1, seq:1, lista:[]};
      /* clientes que moravam no Controle (30/10 a 09/11/2026): o Controle passa pra ca ao
         abrir; se a Agenda abrir antes, ela le de la (sem apagar nada no Controle) */
      if(Array.isArray(this.v1.clientes)) c.lista=this.v1.clientes.map(x=>x&&({id:x.id, nome:String(x.nome||'').trim(),
        whats:String(x.whats||''), obs:String(x.obs||''), criadoEm:String(x.criadoEm||'')}));
    }
    c.lista=c.lista.filter(x=>x&&typeof x==='object'&&Number.isInteger(x.id)&&x.id>0&&String(x.nome||'').trim());
    c.seq=Math.max(Number(c.seq)||1, 1, ...c.lista.map(x=>x.id+1));
    this.cli=c;
    let a=ler(K_AG); if(!a||typeof a!=='object') a={};
    a.v=1;
    if(!Array.isArray(a.horarios)) a.horarios=[];
    a.horarios=a.horarios.filter(h=>h&&typeof h==='object'&&Number.isInteger(h.id)&&/^\d{4}-\d{2}-\d{2}$/.test(h.data)&&/^\d{2}:\d{2}$/.test(h.hora));
    if(!a.ciclos||typeof a.ciclos!=='object') a.ciclos={};
    if(!a.avisos||typeof a.avisos!=='object') a.avisos={};
    a.seq=Math.max(Number(a.seq)||1, 1, ...a.horarios.map(h=>h.id+1));
    this.ag=a;
  },
  salvarCli(){ return gravarK(K_CLI, this.cli); },
  salvarAg(){ return gravarK(K_AG, this.ag); },
  produtos(){ return this.v1.produtos.filter(p=>p&&Number.isInteger(p.id)).sort((a,b)=>String(a.nome).localeCompare(String(b.nome))); },
  produto(id){ return this.v1.produtos.find(p=>p&&p.id===id)||null; },
  loja(){ return String(this.v1.config.loja||''); },
  vendas(){ return this.v1.vendas.filter(v=>v&&typeof v==='object'&&/^\d{4}-\d{2}-\d{2}$/.test(String(v.data))); },
  ciclo(servicoId){ const d=Number(this.ag.ciclos[servicoId]); return (Number.isInteger(d)&&d>0) ? d : REGRAS.CICLO_PADRAO; }
};

/* ============ CLIENTES ============ */
const Cli = {
  nomesDe(c){ return [norm(c.nome)].concat((c.nomesAntigos||[]).map(norm)); },
  /* nome normalizado -> cliente cadastrada (so quando UMA cliente tem esse nome) */
  indice(){ const idx=Object.create(null), dup=Object.create(null);
    Dados.cli.lista.forEach(c=>this.nomesDe(c).forEach(n=>{ if(!n) return; if(idx[n]&&idx[n]!==c) dup[n]=1; else idx[n]=c; }));
    Object.keys(dup).forEach(n=>{ delete idx[n]; });
    return idx; },
  porId(id){ return Dados.cli.lista.find(c=>c.id===id)||null; },
  chaveVenda(v, idx){ let c=null;
    if(v.clienteId!=null) c=this.porId(Number(v.clienteId));
    if(!c && v.cliente) c=idx[norm(v.cliente)]||null;
    if(c) return 'c:'+c.id;
    const n=norm(v.cliente); return n ? 'n:'+n : null; },
  chaveHorario(h, idx){ const c=h.clienteId!=null ? this.porId(h.clienteId) : (idx[norm(h.nome)]||null);
    if(c) return 'c:'+c.id; const n=norm(h.nome); return n ? 'n:'+n : null; },
  /* a mesma cliente escrita de jeitos diferentes: fica a grafia mais usada */
  melhorNome(vs){ const cont=Object.create(null), ordem=[];
    vs.forEach(v=>{ const n=String(v.cliente||'').trim().replace(/\s+/g,' '); if(!n) return;
      if(!cont[n]){ cont[n]=0; ordem.push(n); } cont[n]++; });
    const mai=n=>/^[A-ZÀ-Ý]/.test(n)?1:0;
    return ordem.slice().sort((a,b)=>(cont[b]-cont[a])||(mai(b)-mai(a))||(ordem.indexOf(a)-ordem.indexOf(b)))[0]||''; },
  /* todas as clientes: as da ficha e as que so tem o nome nos trattamenti */
  todas(){
    const idx=this.indice(), g=Object.create(null), h=hoje();
    Dados.cli.lista.forEach(c=>{ g['c:'+c.id]={chave:'c:'+c.id, c, nome:c.nome, vendas:[]}; });
    Dados.vendas().forEach(v=>{ const k=this.chaveVenda(v, idx); if(!k) return;
      if(!g[k]) g[k]={chave:k, c:null, nome:'', vendas:[]}; g[k].vendas.push(v); });
    const futuros=Object.create(null);
    Dados.ag.horarios.forEach(x=>{ if(x.data<h) return; const k=this.chaveHorario(x, idx); if(!k) return;
      if(!futuros[k] || (x.data+x.hora)<(futuros[k].data+futuros[k].hora)) futuros[k]=x; });
    return Object.keys(g).map(k=>{ const x=g[k];
      x.vendas.sort((a,b)=>String(b.data).localeCompare(String(a.data)) || (Number(b.id)||0)-(Number(a.id)||0));
      if(!x.c) x.nome=this.melhorNome(x.vendas);
      x.n=x.vendas.length;
      x.gasto=r2(x.vendas.reduce((s,v)=>s+(Number(v.total)||0),0));
      x.ultima=x.n?x.vendas[0].data:null;
      x.dias=x.ultima?Math.max(0,dias(x.ultima,h)):null;
      x.whats=x.c?String(x.c.whats||''):'';
      x.fiado=r2(x.vendas.filter(v=>ehIncasso(v)).reduce((s,v)=>s+saldo(v),0));
      x.proximo=futuros[k]||null;
      return x; }).filter(x=>x.nome); },
  doGrupo(chave){ return this.todas().find(x=>x.chave===chave)||null; },
  /* servicos que ela mais faz */
  favoritos(x){ const q=Object.create(null);
    x.vendas.forEach(v=>(v.itens||[]).forEach(i=>{ const n=String(i.nome||'').trim(); if(n) q[n]=(q[n]||0)+(Number(i.qtd)||1); }));
    return Object.keys(q).sort((a,b)=>q[b]-q[a]).slice(0,2); },
  /* sumida: muito tempo sem vir, fora da janela da manutencao e sem horario marcado */
  sumida(x){ if(x.dias===null || x.proximo) return false;
    const m=Manut.de(x); const lim=Math.max(REGRAS.SUMIU_DIAS, (m?m.ciclo:REGRAS.CICLO_PADRAO)+REGRAS.JANELA+1);
    return x.dias>=lim; },
  ranking(modo){
    let ls=this.todas();
    if(modo==='sumidas') return ls.filter(x=>this.sumida(x)).sort((a,b)=>b.dias-a.dias);
    const com=ls.filter(x=>x.n>0), sem=ls.filter(x=>x.n===0).sort((a,b)=>a.nome.localeCompare(b.nome));
    com.sort(modo==='vezes' ? (a,b)=>b.n-a.n||b.gasto-a.gasto : (a,b)=>b.gasto-a.gasto||b.n-a.n);
    return com.concat(sem); },
  msgSumida(x){ return `Ciao ${primeiroNome(x.nome)}! È da un po' che non ci vediamo. Ti va di prenotare questa settimana?`; },
  /* cria a ficha de quem so tinha o nome nos trattamenti (ou de uma cliente nova) */
  criar(campos){ const c={id:Dados.cli.seq++, nome:String(campos.nome||'').trim(), whats:String(campos.whats||'').trim(),
      obs:String(campos.obs||'').trim(), criadoEm:agora()};
    Dados.cli.lista.push(c);
    if(!Dados.salvarCli()){ Dados.carregar(); return null; }
    return c; }
};

/* ============ MANUTENCAO ============
   Cada servico tem um ciclo de retorno (padrao 21 dias, editavel em Avisos). Pelo
   ULTIMO trattamento da cliente, o dia da manutencao e a data dele mais o menor ciclo
   dos servicos feitos. O aviso aparece de 2 dias antes ate 8 dias depois, se ela nao
   tem horario marcado. "Chamar" grava o dia em que ela foi chamada (avisos), e o aviso
   desce pro fim da lista ate o proximo trattamento ou horario. */
const Manut = {
  de(x){ if(!x.n) return null; const v=x.vendas[0];
    const its=(v.itens||[]).filter(i=>i&&i.nome);
    if(!its.length) return null;
    let melhor=null;
    its.forEach(i=>{ const c=Dados.ciclo(Number(i.produtoId)); if(!melhor||c<melhor.ciclo) melhor={ciclo:c, servico:String(i.nome)}; });
    const dia=somaDias(v.data, melhor.ciclo);
    return {ciclo:melhor.ciclo, servico:melhor.servico, ultima:v.data, dia, falta:dias(hoje(), dia)}; },
  lista(){ const h=hoje();
    return Cli.todas().map(x=>{ const m=this.de(x); if(!m || x.proximo) return null;
        if(m.falta>REGRAS.ANTES || m.falta< -REGRAS.JANELA) return null;
        const ch=Dados.ag.avisos[x.chave];
        return {x, m, chamadaEm:(ch && ch>=m.ultima) ? ch : null}; }).filter(Boolean)
      .sort((a,b)=>(a.chamadaEm?1:0)-(b.chamadaEm?1:0) || a.m.falta-b.m.falta); },
  quando(m){ const n=Math.abs(m.falta), g=n===1?'giorno':'giorni';
    return m.falta>0 ? 'Giorno del ritorno: tra '+n+' '+g
    : m.falta===0 ? 'Oggi è il giorno del ritorno' : 'È passato '+n+' '+g+' dal giorno del ritorno'; },
  msg(x,m){ const pn=primeiroNome(x.nome), d=dias(m.ultima);
    return m.falta>0
      ? `Ciao ${pn}! Si avvicina il momento di rifare ${m.servico} (${dataCurta(m.dia)}). Vuoi che ti tenga già un posto?`
      : `Ciao ${pn}! Sono passati ${d} ${d===1?'giorno':'giorni'} dall'ultima volta (${m.servico}): è il momento di rifarlo. Ti fisso un appuntamento questa settimana?`; },
  chamar(i){ const it=(this._ultima||[])[i]; if(!it) return;
    abrirWhats(it.x.whats, this.msg(it.x, it.m));
    Dados.ag.avisos[it.x.chave]=hoje();
    if(!Dados.salvarAg()){ Dados.carregar(); }
    Tela.render(); }
};

  feito(h, idx){ const k=Cli.chaveHorario(h, idx); if(!k) return false;
    return Dados.vendas().some(v=>v.data===h.data && Cli.chaveVenda(v, idx)===k); },
  whatsDe(h){ const c=h.clienteId!=null?Cli.porId(h.clienteId):(Cli.indice()[norm(h.nome)]||null); return c?String(c.whats||''):''; },

      <div class="linha2">

    this._sug=ops;

  salvar(){
    const nome=document.getElementById('cNome').value.trim().replace(/\s+/g,' '), whats=document.getElementById('cWhats').value.trim(), obs=document.getElementById('cObs').value.trim();
    if(!nome){ toast('Scrivi il nome della cliente'); return; }
    const x=this.chave?Cli.doGrupo(this.chave):null;
    if(x&&x.c){ const c=x.c;
      /* trocou o nome: o antigo continua ligando os trattamenti que so tem o nome */
      if(norm(c.nome)!==norm(nome)){ c.nomesAntigos=(c.nomesAntigos||[]); if(c.nomesAntigos.map(norm).indexOf(norm(c.nome))<0) c.nomesAntigos.push(c.nome); }
      Object.assign(c,{nome,whats,obs});
      if(!Dados.salvarCli()){ Dados.carregar(); return; }
    } else {
      /* completar a ficha de quem so tinha o nome: se o nome mudou, o de antes fica ligado */
      const ant=x&&norm(x.nome)!==norm(nome)?[x.nome]:[];
      if(!x && Cli.indice()[norm(nome)]){ toast('C\'è già una cliente con questo nome'); return; }
      const c=Cli.criar({nome, whats, obs}); if(!c) return;
      if(ant.length){ c.nomesAntigos=ant; Dados.salvarCli(); }
      this.chave='c:'+c.id;
    }
    toast('Scheda salvata ✓'); Tela.render(); this.pintar(); },
  excluir(){ const x=Cli.doGrupo(this.chave); if(!x||!x.c) return;
    Modal.abrir(`<h3>Eliminare questa scheda?</h3><p class="sub"><b>${esc(x.nome)}</b> perde o WhatsApp e as Note. Os trattamenti dela continuam no Controle.</p>
      <button class="btn perigo" onclick="Ficha.confirmaExcluir()">Sì, elimina</button>
      <button class="btn sec" onclick="Ficha.pintar()">Annulla</button>`); },
  confirmaExcluir(){ const x=Cli.doGrupo(this.chave); if(!x||!x.c) return;
    const id=x.c.id;
    Dados.cli.lista=Dados.cli.lista.filter(c=>c.id!==id);
    if(!Dados.salvarCli()){ Dados.carregar(); return; }
    /* os horarios dela ficam pelo nome */
    let mexeu=false; Dados.ag.horarios.forEach(h=>{ if(h.clienteId===id){ h.clienteId=null; mexeu=true; } });
    if(mexeu) Dados.salvarAg();
    Modal.fechar(); Tela.render(); toast('Scheda eliminata'); }
};

      <div class="filtros" style="margin-top:12px">${f('gasto','Spendono di più')}${f('vezes','Vengono più spesso')}${f('sumidas','Assenti da tempo'+(sumidas?' ('+sumidas+')':''))}</div>

<script>
/* O botao de voltar tem que levar ao MENU DA COMPRADORA, nao ao hub pelado.
   O hub manda `#de=<chave>` no link; aqui isso vira a pasta <chave>/ IRMA desta
   pagina. Sem a marca (alguem abriu o app direto), fica o hub.html de sempre.
   Achado pelo dono em 30/08/2026: voltar caia no menu travado. */
(function(){
  try{
    /* chaves LONGAS primeiro: alternancia em JS casa da esquerda pra direita,
       entao (c|cd) casaria "c" dentro de "cd" e a compradora do bump voltaria
       pro menu do front, sem o Divulga. O $ ancora o fim, pra nao casar prefixo. */
    var m = (location.hash || '').match(/de=(tudo|cpkd|cpk|cpd|ckd|pkd|cd|cp|ck|pk|pd|kd|c|d|p|k|u)$/);
    if(!m) return;

    /* O #de= NAO grava mais o nivel (03/11/2026, achado de seguranca): qualquer um
       abria `divulga.html#de=tudo` e ganhava tudo pra sempre. A memoria so nasce do
       CAMINHO da pasta (hub.html), como antes de 31/08. Quem ja tinha a memoria
       gravada por aqui continua com ela: nada e apagado. O hash serve so pro voltar. */

    var a = document.getElementById('voltarMenu');
    if(!a) return;
    /* O destino sai da PASTA DESTA PAGINA, nunca de '../'.
       BUG REAL, 31/08/2026 (dono, no app instalado): os apps moram em
       /app/index.html, entao '../tudo/' subia um nivel A MAIS e caia em
       lucronamao.github.io/tudo/, fora de /app/. Da 404 no Pages e 401 quando
       o SW nao consegue servir, e a compradora era obrigada a fechar e reabrir
       o app. Mesma classe de erro do fallback do service worker: caminho
       relativo montado sem o prefixo da aplicacao. */
    /* O menu da compradora e o index.html DA PASTA da chave.
       Se esta pagina JA esta dentro da pasta certa (/app/tudo/index.html), o menu
       e o proprio './': nao montar /app/tudo/tudo/, que nao existe.
       Se esta na copia da raiz (/app/index.html, link antigo), sobe pra pasta. */
    var aqui = location.pathname.replace(/[^\/]*$/, '');
    var jaNaPasta = new RegExp('/' + m[1] + '/$').test(aqui);
    a.setAttribute('href', jaNaPasta ? aqui : aqui + m[1] + '/');
  }catch(e){}
})();
</script>




<script>
/* ===== A PAGINA DA RAIZ APONTA PRO MANIFEST DA PASTA (31/08/2026) =====

   PROVADO NO APARELHO, nao suposto. O dono abriu /app/tudo/diagnostico.html,
   adicionou a tela de inicio, e o icone salvou a pasta /app/tudo/: ou seja o iOS
   ignorou a URL da aba e usou a `start_url` do manifest. A start_url VENCE.

   Consequencia pro caso da compradora: as paginas da RAIZ linkam
   /app/manifest.webmanifest, cuja start_url e `/app/hub.html`, SEM chave. Salvando
   de qualquer pagina da raiz (link antigo, historico do Safari, ou o icone velho
   que ela reabriu), o icone nasce travado. Reescrever a URL da aba NAO resolve,
   porque o iOS nao olha a URL: olha o manifest.

   Conserto: se esta pagina sabe a chave, ela troca o <link rel=manifest> pelo
   manifest DA PASTA: que e um arquivo http(s) real, nao blob (blob nao e
   confiavel no iOS, e o manifest precisa ser same-origin da start_url).

   A chave vem, em ordem: do caminho, do #de= que o menu manda, do ?libera=
   antigo, e por fim do nivel que o service worker guarda (Cache Storage, que
   atravessa o isolamento entre Safari e app instalado). */
(function(){
  var MAPA_K = {c:1,d:1,p:1,cd:1,cp:1,u:1,tudo:1};

  function aplicar(chave){
    if(!chave || !MAPA_K[chave]) return;
    var base = location.pathname.replace(/\/app\/.*$/, '/app/');
    if(base.indexOf('/app/') < 0) base = '/app/';
    var href = base + chave + '/manifest.webmanifest';
    var el = document.querySelector('link[rel="manifest"]');
    if(!el){ el = document.createElement('link'); el.rel = 'manifest'; document.head.appendChild(el); }
    if(el.getAttribute('href') !== href) el.setAttribute('href', href);
  }

  try{
    /* 1. caminho */
    var m = location.pathname.match(/\/(tudo|cpkd|cpk|cpd|ckd|pkd|cd|cp|ck|pk|pd|kd|c|d|p|k|u)(?:\/|$)/);
    if(m){ aplicar(m[1]); return; }   /* ja esta na pasta: o manifest local ja serve */

    /* 2. #de= que o menu manda ao abrir o app */
    var h = (location.hash||'').match(/de=(tudo|cpkd|cpk|cpd|ckd|pkd|cd|cp|ck|pk|pd|kd|c|d|p|k|u)$/);
    if(h){ aplicar(h[1]); return; }

    /* 3. ?libera= dos links antigos */
    var q = (new URLSearchParams(location.search).get('libera')||'').replace(/^so-/,'');
    if(MAPA_K[q]){ aplicar(q); return; }

    /* 4. o nivel que o service worker guarda: atravessa Safari -> app instalado */
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready.then(function(reg){
        if(!reg.active) return;
        navigator.serviceWorker.addEventListener('message', function(ev){
          var d = ev.data || {};
          if(d.tipo !== 'nivel' || !Array.isArray(d.itens) || !d.itens.length) return;
          var i = d.itens, c = i.indexOf('controle')>=0, dv = i.indexOf('divulga')>=0, p = i.indexOf('preco')>=0;
          aplicar((c&&dv&&p) ? 'tudo' : (c&&dv) ? 'cd' : (c&&p) ? 'cp' : c ? 'c' : dv ? 'd' : p ? 'p' : null);
        });
        reg.active.postMessage({tipo:'ler-nivel'});
      }).catch(function(){});
    }
  }catch(e){}
})();
</script>
