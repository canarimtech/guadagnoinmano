<!-- CONTROLE DE ESTOQUE (bump, R$ 27, nivel `preco`). Escada de 09/11/2026: a parte de
     materiais do antigo Quanto Cobrar, SEM a calculadora de preco (sem minimo a cobrar,
     valor da hora nem custos fixos). Material com quantidade, quanto pagou e quanto rende;
     o que cada servico gasta; baixa a cada trattamento (quem baixa e o Controle, so pra
     quem tem esta parte); aviso de acabando; Lista della spesa pro WhatsApp ou pra copiar.
     Usa a MESMA chave do Controle (lucrostudioit_v1: materiais e a receita de cada servico),
     entao o backup do Controle ja leva o estoque. -->
<!-- ativacao pelo e-mail da compra: roda ANTES de tudo (ver ativacao.js) -->
<script>/* rede de seguranca da ativacao: decide "legado" ou "pendente" ANTES de a pagina gravar o tema,
   mesmo que o ativacao.js nao carregue (sem isto, a primeira abertura com rede ruim virava legado) */
try{var K='lucrostudioit_ativacao';if(!localStorage.getItem(K)){var u=0;for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.indexOf('lucrostudioit_')===0){u=1;break}}localStorage.setItem(K,JSON.stringify(u?{estado:'legado',desde:Date.now()}:{estado:'pendente'}))}}catch(e){}</script>

<style>
:root{
  --vinho:#8e2757; --vinho-escuro:#6d1d43; --rose:#f6e7ee; --rose-2:#fdf4f8;
  --tinta:#2b2230; --cinza:#675c6d; --linha:#eadfe6; --branco:#fff;
  --verde:#1e7d4f; --verde-bg:#e6f4ec; --ambar:#a05e03; --ambar-bg:#fdf2df;
  --verm:#b3261e; --verm-bg:#fbeae9; --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--rose-2);color:var(--tinta);
  font-size:16px;padding-bottom:76px;min-height:100vh}
header{background:var(--vinho);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:20;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
header h1{font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .loja{font-size:12px;opacity:.85;font-weight:400}
main{padding:14px;max-width:560px;margin:0 auto}
.card{background:var(--branco);border:1px solid var(--linha);border-radius:var(--radius);
  padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:var(--cinza);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--rose);border-radius:12px;padding:12px}
.kpi .v{font-size:22px;font-weight:800;color:var(--vinho);white-space:nowrap;letter-spacing:-.3px}
.kpi .v.grande{font-size:18px}
.kpi .v.pos{color:var(--verde)} .kpi .v.neg{color:var(--verm)}
.kpi .l{font-size:12px;color:var(--cinza);margin-top:2px}
button{font-family:inherit;border:0;cursor:pointer;border-radius:12px;font-size:16px}
.btn{background:var(--vinho);color:#fff;width:100%;padding:15px;font-weight:700;margin-top:8px}
.btn:active{background:var(--vinho-escuro)}
.btn.sec{background:var(--rose);color:var(--vinho)}
.btn.mini{width:auto;padding:8px 14px;font-size:14px;margin:0}
.btn.perigo{background:var(--verm-bg);color:var(--verm)}
input,select{width:100%;padding:13px;border:1.5px solid #8f8496;border-radius:12px;
  font-size:16px;font-family:inherit;background:#fff;margin-top:4px}
input:focus,select:focus{outline:none;border-color:var(--vinho)}
label{font-size:13px;color:var(--cinza);font-weight:600;display:block;margin-top:12px}
.linha2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--linha);
  display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;padding:9px 2px 7px;font-size:11px;color:var(--cinza);
  display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0}
nav button.on{color:var(--vinho);font-weight:700}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lista-item{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;
  border-bottom:1px solid var(--linha);gap:8px}
.lista-item:last-child{border-bottom:0}
.lista-item .info{flex:1;min-width:0}
.lista-item .t{font-weight:600;font-size:15px}
.lista-item .s{font-size:12.5px;color:var(--cinza);margin-top:1px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.badge.ok{background:var(--verde-bg);color:var(--verde)}
.badge.baixo{background:var(--ambar-bg);color:var(--ambar)}
.badge.zero{background:var(--verm-bg);color:var(--verm)}
.badge.fiado{background:var(--ambar-bg);color:var(--ambar)}
/* O fundo do modal segue a AREA VISIVEL (visualViewport), nao a tela inteira: top e height vem do
   script "MODAL ACIMA DO TECLADO". Bug real, 19/10/2026: o teclado do celular cobre o fundo da tela
   sem encolher a pagina; a busca do "Registrar venda" filtrava a lista, o modal (preso no fundo)
   encolhia e ia inteiro para tras do teclado. */
.modal-fundo{position:fixed;left:0;right:0;top:0;height:100%;background:rgba(43,34,48,.5);z-index:40;display:none;
  align-items:flex-end;justify-content:center}
.modal-fundo.aberto{display:flex}
.modal{background:#fff;border-radius:18px 18px 0 0;width:100%;max-width:560px;
  max-height:88%;overflow-y:auto;padding:18px 16px 24px}
/* teclado aberto: o modal ocupa a area visivel inteira, entao o campo fica parado no topo
   enquanto a lista encolhe embaixo dele */
.modal-fundo.teclado .modal{height:100%;max-height:none;border-radius:0}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .sub{font-size:13px;color:var(--cinza);margin-bottom:10px}
.aviso{border-radius:12px;padding:11px 12px;font-size:13.5px;margin-bottom:12px;display:flex;gap:8px;align-items:flex-start}
.aviso.backup{background:var(--ambar-bg);color:var(--ambar)}
.aviso.verde{background:var(--verde-bg);color:var(--verde)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:88px;background:var(--tinta);
  color:#fff;padding:12px 18px;border-radius:12px;font-size:14.5px;z-index:60;opacity:0;
  transition:opacity .25s;max-width:92vw;text-align:center;pointer-events:none}
.toast.mostra{opacity:1}
.toast.guadagno{background:var(--verde);font-weight:700}
.vazio{text-align:center;color:var(--cinza);font-size:14px;padding:26px 10px;line-height:1.5}
.passo{font-size:12px;color:var(--cinza);text-align:center;margin-bottom:10px;font-weight:600}
.escolha-prod{display:flex;justify-content:space-between;align-items:center;width:100%;
  background:var(--rose);text-align:left;padding:13px;margin-bottom:8px;border-radius:12px}
.escolha-prod .n{font-weight:700} .escolha-prod .p{color:var(--vinho);font-weight:700}
.qtd-row{display:flex;align-items:center;gap:14px;justify-content:center;margin:10px 0}
.qtd-row button{width:52px;height:52px;font-size:26px;background:var(--rose);color:var(--vinho);font-weight:800}
.qtd-row .n{font-size:30px;font-weight:800;min-width:52px;text-align:center}
/* carrinho de venda (varios produtos numa venda) */
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:8px;
  background:var(--rose-2);border:1px solid var(--rose);padding:11px 12px;margin-bottom:8px;border-radius:12px}
.cart-item .n{font-weight:700;font-size:15px;line-height:1.3}
.cart-item .s{font-size:12.5px;color:var(--cinza);margin-top:2px}
.cart-item .v{font-weight:800;white-space:nowrap}
.cart-item .x{width:34px;height:34px;flex-shrink:0;padding:0;font-size:19px;font-weight:800;
  background:#fff;color:var(--cinza);border:1px solid var(--linha)}
.cart-tot{display:flex;justify-content:space-between;align-items:baseline;
  border-top:2px solid var(--vinho);margin-top:4px;padding-top:10px}
.cart-tot .l{font-weight:700;font-size:15px} .cart-tot .v{font-weight:800;font-size:22px;color:var(--vinho)}
.cart-guadagno{text-align:right;font-size:13px;color:var(--verde);font-weight:700;margin-top:2px}
/* recebimento de Da incassare (total ou parcial) */
.fi-linhas{background:var(--rose-2);border-radius:12px;padding:12px;margin:4px 0 14px}
.fi-linha{display:flex;justify-content:space-between;font-size:14.5px;padding:3px 0}
.fi-linha.falta{border-top:1px solid var(--rose);margin-top:5px;padding-top:7px;font-weight:800;font-size:16px}
.fi-linha.falta .v{color:var(--vinho)}
/* ===== O NUMERO QUE IMPORTA E GRANDE (21/09/2026) =====
   Regra do dono: "as clientes tem MUITA dificuldade com app, tem que ser facil e
   visualmente simples". Antes, "ainda falta" era mais uma linha do mesmo tamanho
   entre outras duas, e o resultado do que ela digitava vinha como frase corrida.
   Agora o que ela precisa conferir de relance (quanto deve agora, quanto fica
   depois) e numero grande, e a frase vira so o rotulo em cima dele. */
.fi-falta{border-top:1px solid var(--rose);margin-top:8px;padding-top:9px;text-align:center}
.fi-falta .rot{font-size:12.5px;color:var(--cinza);font-weight:600;text-transform:lowercase}
.fi-falta .big{font-size:29px;font-weight:800;color:var(--vinho);line-height:1.15;margin-top:2px}
.fi-previa .rot{font-size:12.5px;color:var(--cinza);font-weight:600;line-height:1.35}
.fi-previa .big{font-size:25px;font-weight:800;color:var(--vinho);line-height:1.15;margin-top:3px}
.fi-previa.quita .rot{color:var(--verde)}
.fi-previa.quita .big{color:var(--verde)}
.fi-hist{font-size:12.5px;color:var(--cinza);margin-top:8px;line-height:1.6}
/* parcelas combinadas, dentro do quadro de valores do Da incassare */
.fi-parc{border-top:1px solid var(--rose);margin-top:8px;padding-top:8px;
  font-size:13.5px;color:var(--cinza);text-align:center}
.fi-parc b{color:var(--vinho)}
/* atalhos que SO preenchem o campo: visual de link, nunca de botao de acao */
.fi-atalhos{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
.fi-atalhos button{flex:1;min-width:120px;padding:10px 8px;background:#fff;

/* a previa: diz o que o botao vai fazer, antes de ela tocar */
.fi-previa{margin-top:12px;background:var(--rose-2);border-radius:11px;padding:11px 12px;
  font-size:14px;text-align:center;color:var(--tinta);line-height:1.45}
.fi-previa b{color:var(--vinho)}
.fi-previa.quita{background:var(--verde-bg);color:var(--verde)}
.fi-previa.quita b{color:var(--verde)}
.fi-previa.aviso-erro{background:var(--verm-bg);color:var(--verm)}
.fi-previa.aviso-erro b{color:var(--verm)}
.fi-previa.aviso-vazio{background:var(--rose-2);color:var(--cinza)}
.btn:disabled{opacity:.45}
/* data da despesa: hoje/ontem resolvem o caso comum sem abrir o calendario */
.dt-atalhos{display:flex;gap:7px;margin:6px 0 8px}
.dt-atalhos button{flex:1;padding:12px 8px;background:#fff;border:1.5px solid var(--linha);
  color:var(--vinho);font-size:14.5px;font-weight:700;border-radius:11px}
.dt-atalhos button.on{background:var(--vinho);color:#fff;border-color:var(--vinho)}
.dt-atalhos button:active{opacity:.75}
.dt-previa{margin-top:9px;background:var(--rose-2);border-radius:11px;padding:10px 12px;
  font-size:13.5px;text-align:center;color:var(--tinta);line-height:1.45}
.dt-previa b{color:var(--vinho)}
.dt-previa.erro{background:var(--verm-bg);color:var(--verm)}
.dt-previa.erro b{color:var(--verm)}
/* cancelar embaixo de um botao de acao nao pode ter o mesmo peso dele */
.btn.discreto{background:none;color:var(--cinza);font-weight:600;padding:12px;font-size:14.5px}
.btn.discreto:active{background:var(--rose-2)}
/* historico recolhido: ocupa uma linha ate ela querer ver */
.fi-det{margin-top:14px;border-top:1px solid var(--linha);padding-top:10px}
.fi-det summary{font-size:13.5px;color:var(--cinza);font-weight:600;cursor:pointer;

.fi-det summary::-webkit-details-marker{display:none}
.fi-det summary::before{content:'\203a';font-weight:800;color:var(--vinho);font-size:17px;
  line-height:1;display:inline-block;width:10px;text-align:center}
.fi-det[open] summary::before{content:'\2039'}
.fi-hl{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 0;font-size:13.5px;border-bottom:1px solid var(--linha)}
.fi-hl:last-child{border-bottom:0}
.fi-hl button{font-size:11.5px;padding:4px 9px}
.pgto-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.pgto-grid button{padding:13px;background:var(--rose);color:var(--tinta);font-weight:600;font-size:15px}
.pgto-grid button.on{background:var(--vinho);color:#fff}
/* parcelas: grade de botoes grandes, do mesmo tamanho, faceis de acertar com o dedo */

.venda-bloco{border-bottom:1px solid var(--linha);padding:13px 2px 12px}

.venda-topo .t{font-weight:600;font-size:15px;line-height:1.3}

.venda-valor{text-align:right;flex-shrink:0}

.desc-ctrl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.desc-tipo{display:flex;background:var(--rose);border-radius:9px;padding:3px}

.mes-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

<script>
/* ============ DADOS (localStorage, 1 chave, versao no schema) ============ */
const CHAVE = 'lucrostudioit_v1';
const D = {
  dados: null,
  novo(){ return {v:1, config:{loja:'', criadoEm:hoje(), ultimoBackup:null, vendasDesdeBackup:0, wizardOk:false},
           produtos:[], vendas:[], despesas:[], seq:1}; },
  carregar(){ try{ this.dados = JSON.parse(localStorage.getItem(CHAVE)) || this.novo(); }
              catch(e){ this.dados = this.novo(); }
    if(!Array.isArray(this.dados.produtos)) this.dados.produtos=[];
    if(!Array.isArray(this.dados.vendas)) this.dados.vendas=[]; },
  /* Celular sem espaco (o localStorage tem uns 5 MB, dividido com fotos e logo):
     antes o erro parava o fluxo no meio, sem aviso, e a venda sumia ao reabrir.
     Agora avisa alto e por mais tempo, e devolve false (26/10/2026). */
  salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(this.dados)); return true; }
    catch(e){ toast('Non è stato possibile salvare: il telefono è pieno. Tocca subito Backup in alto e libera spazio sul telefono.'); clearTimeout(toastTimer);
      toastTimer=setTimeout(()=>{ document.getElementById('toast').className='toast'; },9000); return false; } },
  /* salvou ou desfez (08/11/2026, igual ao Controle): sem espaco, a memoria volta ao
     que esta gravado e quem chamou nao anuncia sucesso */
  gravar(){ if(this.salvar()) return true; this.carregar(); garantirEst(); return false; },
  id(){ return this.dados.seq++; }
};
/* ===== O DIA E O DO CELULAR DELA (16/10/2026) =====
   Antes era new Date().toISOString(), que da o dia em Londres (UTC). No horario de
   Brasilia, das 21h a meia-noite a venda nascia com a data de AMANHA, sumia da tela
   Oggi e, no ultimo dia do mes, caia no mes seguinte. Agora e o dia do fuso do
   aparelho, que no Brasil e o da cidade dela (Brasilia, Manaus, Acre, Noronha). */
function hoje(){ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function agora(){ return new Date().toISOString(); }
function dataBR(iso){ return String(iso).split('-').reverse().join('/'); }
/* n dias antes de um dia ISO, sem o fuso mexer no resultado */
function diaAntes(iso, n){ const d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()-n); return d.toISOString().slice(0,10); }
/* o espaco aqui e NAO-SEPARAVEL (\u00a0): sem ele "4x de R$ 35,00" quebrava entre
   o "R$" e o numero no fim da linha, e a lojista tinha que remontar o valor */
function rs(n){ return new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(Math.round(n*100)/100)); }
function num(v){ const s=String(v).replace(/[^\d,.-]/g,'').replace(/\./g,'').replace(',','.'); const n=parseFloat(s); return isNaN(n)?0:n; }
function fmtMoeda(n){ return (n||n===0) ? rs(n) : ''; }
const PGTO_LABEL={contanti:'Contanti',carta:'Carta',bonifico:'Bonifico',satispay:'Satispay',da_incassare:'Da incassare',pix:'Contanti',Contanti:'Contanti','Carta':'Carta',cartao:'Carta','Da incassare':'Da incassare'};
function rotuloPgto(f){ return PGTO_LABEL[f]||f; }
function ehIncasso(x){ const k=(x&&typeof x==='object')?x.pgto:x; return k==='da_incassare'||k==='Da incassare'; }
/* ===== PARCELAS (14/09/2026) =====
   Opcoes que a lojista de fato usa. A parcela e arredondada pra CIMA no centavo,
   pra n parcelas nunca somarem menos que o total. */
const PARCELAS_OPC = [1,2,3,4,5,6,10,12];
function valorParcela(total,n){ return n>1 ? Math.ceil(total/n*100)/100 : total; }
/* como a venda parcelada se le numa linha: "3x de R$ 40,00".
   A base e `parcelasBase` quando ela existe (Da incassare em que a lojista parcelou o
   saldo devedor, nao o total), e o total nos demais casos. */
function baseParcela(v){
  return (v && typeof v.parcelasBase === 'number' && v.parcelasBase > 0) ? v.parcelasBase : (v ? v.total : 0);
}
function textoParcelas(v){
  const n = v && v.parcelas ? v.parcelas : 1;
  return n>1 ? n+'\u00a0rate da\u00a0'+rs(valorParcela(baseParcela(v),n)) : '';
}
/* ===== DESCONTO NA HORA DA VENDA (30/09/2026) =====
   Pedido de compradoras: nao dava pra dar desconto no ato. A venda guarda o
   desconto JA EM REAIS em v.desconto, e v.total nasce liquido (itens - desconto).
   Por isso faturamento, guadagno, Da incassare, parcelas e recibo continuam lendo v.total e
   batem sem mudar nada. Quem soma os itens de novo (backup, "+ produto" no Da incassare,
   ranking de produtos) tem que descontar v.desconto, senao o desconto some.
   v.descPct existe so pra mostrar "10%" no recibo; a conta nunca le ele. */
function somaItens(itens){ return Math.round(itens.reduce((s,i)=>s+i.preco*i.qtd,0)*100)/100; }
function descEmReais(sub, tipo, valor){
  const d = tipo==='pct' ? sub*Math.min(Math.max(valor,0),100)/100 : Math.max(valor,0);
  return Math.round(Math.min(d, sub)*100)/100;
}
function descontoDe(v){ return v && v.desconto>0 ? v.desconto : 0; }
function textoSconto(v){
  return descontoDe(v) ? rs(v.desconto)+(v.descPct?' ('+String(v.descPct).replace('.',',')+'%)':'') : '';
}
/* ===== A MASCARA RODA NA CAPTURA, E O MOTIVO E UM BUG REAL (21/09/2026) =====
   Um listener no `document` em fase de BORBULHA roda DEPOIS do `oninput` do proprio
   campo. Entao a previa do Da incassare lia o valor AINDA SEM mascara: a lojista digitava
   "6000", o campo mostrava "R$ 60,00" e o botao prometia "Receber R$ 6,00", dez
   vezes menos, com a previa e o botao se contradizendo na mesma tela.
   Com `capture:true` a mascara formata ANTES de qualquer oninput, entao todo mundo
   que le o campo le o mesmo numero que ela esta vendo. */
document.addEventListener('input',function(e){
  const el=e.target; if(!el||!el.matches) return;

const Modal = {
  /* ===== O MODAL E UM DIALOGO (acessibilidade, 26/10/2026) =====
     O leitor de tela nao sabia que o modal tinha aberto e seguia lendo a tela de
     tras. Agora: o titulo da nome ao dialogo, o resto da pagina fica inerte, o

  _volta:null,
  abrir(html){ const c=document.getElementById('modalCorpo'), f=document.getElementById('modalFundo');

    if(tit){ tit.id='modalTit'; c.setAttribute('aria-labelledby','modalTit'); } else c.removeAttribute('aria-labelledby');

/* ============ PAGINACAO (20 por pagina) ============ */
const POR_PAGINA = 20;
function paginar(lista, pagina){
  const total=lista.length, paginas=Math.max(1,Math.ceil(total/POR_PAGINA));
  const p=Math.min(Math.max(1,pagina),paginas);
  return {itens:lista.slice((p-1)*POR_PAGINA, p*POR_PAGINA), pagina:p, paginas, total,
    de:total?((p-1)*POR_PAGINA+1):0, ate:Math.min(p*POR_PAGINA,total)};
}
function barraPag(info, fnIr){
  if(info.paginas<=1) return info.total>POR_PAGINA?'':'';
  const b=(rot,pg,dis,on)=>`<button ${dis?'disabled':''} class="${on?'on':''}" onclick="${fnIr}(${pg})">${rot}</button>`;
  let nums=[];
  const p=info.pagina, t=info.paginas;
  let ini=Math.max(1,p-1), fim=Math.min(t,p+1);
  if(p===1) fim=Math.min(t,3);
  if(p===t) ini=Math.max(1,t-2);
  if(ini>1) nums.push(b('1',1,false,false));
  if(ini>2) nums.push('<button disabled>...</button>');
  for(let i=ini;i<=fim;i++) nums.push(b(String(i),i,false,i===p));
  if(fim<t-1) nums.push('<button disabled>...</button>');
  if(fim<t) nums.push(b(String(t),t,false,false));
  return `<div class="pag">
    ${b('&lsaquo;',p-1,p===1,false)}${nums.join('')}${b('&rsaquo;',p+1,p===t,false)}
    <div class="info">da ${info.de} a ${info.ate} di ${info.total}</div></div>`;
}

/* ===== O FIADO ENTRA NO LUCRO QUANDO O DINHEIRO ENTRA (14/09/2026) =====

   Regra do dono: "no Da incassare, deve somar no guadagno/faturamento somente quando o valor
   for baixado del conto. Somar antes de receber nao faz sentido."

   O que muda: a venda fiada NAO conta mais integral no mes em que foi feita. Cada
   recebimento (v.pagamentos=[{data,valor}]) entra no faturamento do mes DAQUELA data,

   setembro aparece em setembro: e o regime de caixa, que e o que a lojista ve no
   bolso.

   A proporcao do custo importa: sem ela, um Da incassare com 50% recebido mostraria guadagno
   inflado (receita pela metade, custo zero) ou negativo (receita pela metade, custo

/* ============ CONTROLE DE ESTOQUE (bump do Controle do Studio, 09/11/2026) ============
   Usa a MESMA base do Controle (chave lucrostudioit_v1): os servicos sao os mesmos.
   - material: quanto pagou numa unidade, quantos usos ela rende, quantas unidades tem
     e quanto da unidade aberta ja foi gasto (consumido, em usos);
   - receita de cada servico: que material e quantos usos ele gasta. O gasto de
     material do servico no Controle passa a ser esta conta, sozinho;
   - a baixa a cada trattamento e feita pelo Controle (baixarMateriais, index.html),
     so pra quem tem esta parte. Mudou a conta do "acabando" aqui, mude la.
   O que era do Quanto Cobrar (valor da hora, custos fixos, minimo a cobrar) saiu.
   O dado antigo (qc) fica guardado e o backup continua levando, sem tela. */

  usosRestantes(m){ return Math.max(0,(m.unidades||0)*(m.rende||0)-(m.consumido||0)); },
  /* acabando: sobra 30% de uma unidade ou menos (e no minimo 3 usos) */
  acabando(m){ const r=this.usosRestantes(m); return m.rende>0 && r<=Math.max(3, m.rende*0.3); },
  material(p){ return (p.receita||[]).reduce((s,r)=>{ const m=D.dados.materiais.find(x=>x.id===r.materialId); return s+(m?this.custoUso(m)*r.usos:0); },0); }

      :'<div class="vazio">Prima aggiungi i tuoi prodotti (scheda Prodotti).</div>'}
      <p class="sub" style="margin-top:12px">Materiale per trattamento: <b>${rs(Est.material({receita:this.rec}))}</b>. Questo diventa il Costo del materiale del trattamento in Guadagno in Mano.</p>
      <button class="btn" onclick="Receita.salvar()">Salva</button>
      <button class="btn discreto" onclick="Modal.fechar()">Annulla</button>`); },
  usos(mid,d){ let r=this.rec.find(x=>x.materialId===mid);
    if(!r){ if(d<0) return; r={materialId:mid,usos:0}; this.rec.push(r); }
    r.usos=Math.max(0,r.usos+d); this.rec=this.rec.filter(x=>x.usos>0); this.pintar(); },
  salvar(){ const p=this.p; p.receita=this.rec;
    if(p.receita.length) p.custo=Math.round(Est.material(p)*100)/100;
    if(!D.gravar()){ Tela.render(); return; } Modal.fechar(); Tela.render(); toast('Salvo ✓'); },
  /* material mudou de preco: o custo de todo servico que usa ele acompanha */
  atualizarCustos(){ D.dados.produtos.forEach(p=>{ if((p.receita||[]).length) p.custo=Math.round(Est.material(p)*100)/100; }); }
};

<script>
/* O botao de voltar tem que levar ao MENU DA COMPRADORA, nao ao hub pelado.
   O hub manda `#de=<chave>` no link; aqui isso vira a pasta <chave>/ IRMA desta
   pagina. Sem a marca (alguem abriu o app direto), fica o hub.html de sempre.

(function(){
  try{
    /* chaves LONGAS primeiro: alternancia em JS casa da esquerda pra direita,
       entao (c|cd) casaria "c" dentro de "cd" e a compradora do bump voltaria
       pro menu do front, sem o Divulga. O $ ancora o fim, pra nao casar prefixo. */
    var m = (location.hash || '').match(/de=(tudo|cpkd|cpk|cpd|ckd|pkd|cd|cp|ck|pk|pd|kd|c|d|p|k|u)$/);
    if(!m) return;

    /* O #de= NAO grava mais o nivel (03/11/2026, achado de seguranca): qualquer um
       abria `divulga.html#de=tudo` e ganhava tudo pra sempre. A memoria so nasce do
       CAMINHO da pasta (hub.html), como antes de 31/08. Quem ja tinha a memoria
       gravada por aqui continua com ela: nada e apagado. O hash serve so pro voltar. */

    var a = document.getElementById('voltarMenu');
    if(!a) return;
    /* O destino sai da PASTA DESTA PAGINA, nunca de '../'.
       BUG REAL, 31/08/2026 (dono, no app instalado): os apps moram em
       /app/index.html, entao '../tudo/' subia um nivel A MAIS e caia em
       lucronamao.github.io/tudo/, fora de /app/. Da 404 no Pages e 401 quando
       o SW nao consegue servir, e a compradora era obrigada a fechar e reabrir
       o app. Mesma classe de erro do fallback do service worker: caminho
       relativo montado sem o prefixo da aplicacao. */
    /* O menu da compradora e o index.html DA PASTA da chave.
       Se esta pagina JA esta dentro da pasta certa (/app/tudo/index.html), o menu
       e o proprio './': nao montar /app/tudo/tudo/, que nao existe.
       Se esta na copia da raiz (/app/index.html, link antigo), sobe pra pasta. */
    var aqui = location.pathname.replace(/[^\/]*$/, '');
    var jaNaPasta = new RegExp('/' + m[1] + '/$').test(aqui);
    a.setAttribute('href', jaNaPasta ? aqui : aqui + m[1] + '/');
  }catch(e){}
})();
</script>




<script>
/* ===== A PAGINA DA RAIZ APONTA PRO MANIFEST DA PASTA (31/08/2026) =====

   PROVADO NO APARELHO, nao suposto. O dono abriu /app/tudo/diagnostico.html,
   adicionou a tela de inicio, e o icone salvou a pasta /app/tudo/: ou seja o iOS
   ignorou a URL da aba e usou a `start_url` do manifest. A start_url VENCE.

   Consequencia pro caso da compradora: as paginas da RAIZ linkam
   /app/manifest.webmanifest, cuja start_url e `/app/hub.html`, SEM chave. Salvando
   de qualquer pagina da raiz (link antigo, historico do Safari, ou o icone velho
   que ela reabriu), o icone nasce travado. Reescrever a URL da aba NAO resolve,
   porque o iOS nao olha a URL: olha o manifest.

   Conserto: se esta pagina sabe a chave, ela troca o <link rel=manifest> pelo
   manifest DA PASTA: que e um arquivo http(s) real, nao blob (blob nao e
   confiavel no iOS, e o manifest precisa ser same-origin da start_url).

   A chave vem, em ordem: do caminho, do #de= que o menu manda, do ?libera=
   antigo, e por fim do nivel que o service worker guarda (Cache Storage, que
   atravessa o isolamento entre Safari e app instalado). */
(function(){
  var MAPA_K = {c:1,d:1,p:1,cd:1,cp:1,u:1,tudo:1};

  function aplicar(chave){
    if(!chave || !MAPA_K[chave]) return;
    var base = location.pathname.replace(/\/app\/.*$/, '/app/');
    if(base.indexOf('/app/') < 0) base = '/app/';
    var href = base + chave + '/manifest.webmanifest';
    var el = document.querySelector('link[rel="manifest"]');
    if(!el){ el = document.createElement('link'); el.rel = 'manifest'; document.head.appendChild(el); }
    if(el.getAttribute('href') !== href) el.setAttribute('href', href);
  }

  try{
    /* 1. caminho */
    var m = location.pathname.match(/\/(tudo|cpkd|cpk|cpd|ckd|pkd|cd|cp|ck|pk|pd|kd|c|d|p|k|u)(?:\/|$)/);
    if(m){ aplicar(m[1]); return; }   /* ja esta na pasta: o manifest local ja serve */

    /* 2. #de= que o menu manda ao abrir o app */
    var h = (location.hash||'').match(/de=(tudo|cpkd|cpk|cpd|ckd|pkd|cd|cp|ck|pk|pd|kd|c|d|p|k|u)$/);
    if(h){ aplicar(h[1]); return; }

    /* 3. ?libera= dos links antigos */
    var q = (new URLSearchParams(location.search).get('libera')||'').replace(/^so-/,'');
    if(MAPA_K[q]){ aplicar(q); return; }

    /* 4. o nivel que o service worker guarda: atravessa Safari -> app instalado */
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready.then(function(reg){
        if(!reg.active) return;
        navigator.serviceWorker.addEventListener('message', function(ev){
          var d = ev.data || {};
          if(d.tipo !== 'nivel' || !Array.isArray(d.itens) || !d.itens.length) return;
          var i = d.itens, c = i.indexOf('controle')>=0, dv = i.indexOf('divulga')>=0, p = i.indexOf('preco')>=0;
          aplicar((c&&dv&&p) ? 'tudo' : (c&&dv) ? 'cd' : (c&&p) ? 'cp' : c ? 'c' : dv ? 'd' : p ? 'p' : null);
        });
        reg.active.postMessage({tipo:'ler-nivel'});
      }).catch(function(){});
    }
  }catch(e){}
})();
</script>
